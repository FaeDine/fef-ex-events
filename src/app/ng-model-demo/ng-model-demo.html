<h2>1. Two-way binding with ngModel</h2>

<!-- TODO (Part 1): Before any [(ngModel)] will compile, import FormsModule in app-module.ts -->

<h3>Text</h3>
<input type="text" [(ngModel)]="name">
<p>Hello {{name}}</p>

<h3>Checkbox</h3>
<input type="checkbox" [(ngModel)]="active">
<p>Active: {{active}}</p>

<h3>Radio buttons</h3>
<input type="radio" [(ngModel)]="gender"
    value="male"> Male
<input type="radio" [(ngModel)]="gender"
    value="female"> Female
<p>{{gender}}</p>

<h3>Range</h3>
<input type="range" [(ngModel)]="myRange">
<p>{{myRange}}</p>

<h3>Select</h3>
<select [(ngModel)]="carMake">
    <option value="volvo">Volvo</option>
    <option value="saab">Saab</option>
    <option value="mercedes">Mercedes</option>
    <option value="audi">Audi</option>
</select>
<p>{{carMake}}</p>
